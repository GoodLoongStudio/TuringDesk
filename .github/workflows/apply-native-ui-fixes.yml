name: Apply native UI fixes

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/apply-native-ui-fixes.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Apply patch
        shell: pwsh
        run: .\scripts\apply-native-ui-fixes.ps1
      - name: Remove temporary patch machinery
        shell: pwsh
        run: |
          Remove-Item .\scripts\apply-native-ui-fixes.ps1 -Force
          Remove-Item .\.github\workflows\apply-native-ui-fixes.yml -Force
      - name: Commit
        shell: pwsh
        run: |
          git config user.name "GoodLoongStudio"
          git config user.email "chnmlong@hotmail.com"
          git add -A
          if (git diff --cached --quiet) { exit 0 }
          git commit -m "feat: add continuous L3 CLI and polish native search UI"
          git push origin HEAD:main
