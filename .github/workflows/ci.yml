name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: turingdesk-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  runtime:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: runtime
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.19.0
      - run: corepack enable
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm build
      - run: pnpm test:mcp
      - name: Boot bundled DeepSeek Harness + TuringDesk MCP
        run: pnpm test:harness

  installer-win-arm64:
    needs: [runtime]
    runs-on: windows-11-arm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.19.0
          architecture: arm64
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Verify native ARM64 runner toolchain
        shell: pwsh
        run: |
          $nodeArch = (node -p "process.arch").Trim()
          $osArch = [System.Runtime.InteropServices.RuntimeInformation]::OSArchitecture.ToString()
          Write-Host "Node architecture: $nodeArch"
          Write-Host "OS architecture: $osArch"
          if ($nodeArch -ne "arm64") { throw "Expected native ARM64 Node, got $nodeArch" }
          if ($osArch -ne "Arm64") { throw "Expected Windows ARM64 runner, got $osArch" }

      - name: Parse packaging and recovery scripts
        shell: pwsh
        run: |
          $files = @(
            "scripts/generate-brand-icon.ps1",
            "scripts/package-portable.ps1",
            "scripts/package-installer.ps1",
            "packaging/shell/Enable-TuringDeskShell.ps1",
            "packaging/shell/Restore-Explorer.ps1"
          )
          foreach ($file in $files) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $file), [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count -gt 0) {
              $errors | ForEach-Object { Write-Error "${file}: $($_.Message)" }
              throw "PowerShell parser rejected $file"
            }
          }

      - name: Validate installed shell script with Windows PowerShell 5.1
        shell: powershell
        run: |
          $file = "packaging/shell/Enable-TuringDeskShell.ps1"
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $file), [ref]$tokens, [ref]$errors) | Out-Null
          if ($errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Error "${file}: $($_.Message)" }
            throw "Windows PowerShell 5.1 parser rejected $file"
          }
          $nonAscii = [System.IO.File]::ReadAllBytes((Resolve-Path $file)) | Where-Object { $_ -gt 127 }
          if ($nonAscii.Count -gt 0) {
            throw "$file must remain ASCII-safe because the MSI invokes it with Windows PowerShell 5.1."
          }

      - name: Verify v0.14 desktop UX contract
        shell: pwsh
        run: |
          if (Test-Path "src/TuringDesk.Desktop/AgentOrbWindow.xaml") { throw "Legacy AgentOrbWindow.xaml must not ship in v0.14" }
          if (Test-Path "src/TuringDesk.Desktop/AgentOrbWindow.xaml.cs") { throw "Legacy AgentOrbWindow.xaml.cs must not ship in v0.14" }
          foreach ($required in @(
            "src/TuringDesk.Desktop/DesktopSearchBarWindow.xaml",
            "src/TuringDesk.Desktop/DesktopSearchBarWindow.xaml.cs",
            "src/TuringDesk.Desktop/Services/DesktopSearchReservedArea.cs",
            "src/TuringDesk.Desktop/Services/HarnessModelBridgeService.cs",
            "docs/V0.14-SEARCH-DESKTOP.md"
          )) {
            if (-not (Test-Path $required)) { throw "Missing v0.14 UX source: $required" }
          }
          $mode = Get-Content "src/TuringDesk.Desktop/MainWindow.EnhancementMode.cs" -Raw
          if ($mode -notmatch "DesktopSearchBarWindow") { throw "Enhancement mode is not wired to DesktopSearchBarWindow" }
          if ($mode -match "AgentOrbWindow") { throw "Enhancement mode still references legacy AgentOrbWindow" }

      - name: Build Desktop and ShellHost with embedded application icons
        shell: pwsh
        run: |
          dotnet restore src/TuringDesk.Desktop/TuringDesk.Desktop.csproj
          if ($LASTEXITCODE -ne 0) { throw "Desktop restore failed: $LASTEXITCODE" }
          dotnet build src/TuringDesk.Desktop/TuringDesk.Desktop.csproj --configuration Release --no-restore
          if ($LASTEXITCODE -ne 0) { throw "Desktop build failed: $LASTEXITCODE" }
          dotnet restore src/TuringDesk.ShellHost/TuringDesk.ShellHost.csproj
          if ($LASTEXITCODE -ne 0) { throw "ShellHost restore failed: $LASTEXITCODE" }
          dotnet build src/TuringDesk.ShellHost/TuringDesk.ShellHost.csproj --configuration Release --no-restore
          if ($LASTEXITCODE -ne 0) { throw "ShellHost build failed: $LASTEXITCODE" }

      - run: corepack enable

      - name: Build and verify native ARM64 MSI
        shell: pwsh
        run: ./scripts/package-installer.ps1 -Version "v0.14.0" -RuntimeIdentifier "win-arm64"

      - name: Verify MSI artifact
        shell: pwsh
        run: |
          $msi = Resolve-Path "artifacts/TuringDesk-v0.14.0-win-arm64.msi"
          $size = (Get-Item $msi).Length
          Write-Host "MSI: $msi"
          Write-Host "Size: $size bytes"
          if ($size -lt 1MB) { throw "MSI is unexpectedly small: $size bytes" }

      - name: Upload native ARM64 Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: TuringDesk-v0.14.0-win-arm64-installer
          path: |
            artifacts/TuringDesk-v0.14.0-win-arm64.msi
            artifacts/TuringDesk-v0.14.0-win-arm64/BUILD-INFO.txt
          if-no-files-found: error
          retention-days: 30
