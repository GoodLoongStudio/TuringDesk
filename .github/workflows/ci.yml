name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  runtime:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: runtime
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.19.0
      - run: corepack enable
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm build
      - run: pnpm test:mcp
      - name: Boot bundled DeepSeek Harness + TuringDesk MCP
        run: pnpm test:harness

  desktop:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - run: dotnet restore src/TuringDesk.Desktop/TuringDesk.Desktop.csproj
      - run: dotnet build src/TuringDesk.Desktop/TuringDesk.Desktop.csproj --configuration Release --no-restore

  portable-win-x64:
    needs: [runtime, desktop]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.19.0
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - run: corepack enable
      - name: Build and verify portable package
        shell: pwsh
        run: ./scripts/package-portable.ps1 -Version "v0.2"
      - name: Upload portable package
        uses: actions/upload-artifact@v4
        with:
          name: TuringDesk-v0.2-win-x64
          path: artifacts/TuringDesk-v0.2-win-x64/**
          if-no-files-found: error
          retention-days: 30
