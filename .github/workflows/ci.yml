name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      package:
        description: Build the Windows ARM64 MSI installer
        required: false
        default: false
        type: boolean

concurrency:
  group: turingdesk-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  runtime:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: runtime
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.19.0
      - run: corepack enable
      - run: corepack prepare pnpm@11.7.0 --activate
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm build
      - run: pnpm test:mcp
      - name: Boot bundled DeepSeek Harness + TuringDesk MCP
        run: pnpm test:harness

  desktop-win-arm64:
    needs: [runtime]
    runs-on: windows-11-arm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.424

      - name: Verify desktop search and Harness contract
        shell: pwsh
        run: |
          foreach ($required in @(
            "src/TuringDesk.Desktop/DesktopSearchBarWindow.xaml",
            "src/TuringDesk.Desktop/DesktopSearchBarWindow.xaml.cs",
            "src/TuringDesk.Desktop/MainWindow.AgentEntry.cs",
            "src/TuringDesk.Desktop/Services/DesktopSearchIndexService.cs",
            "src/TuringDesk.Desktop/Services/DesktopAiModelChoiceService.cs",
            "src/TuringDesk.Desktop/Services/HarnessModelBridgeService.cs"
          )) {
            if (-not (Test-Path $required)) { throw "Missing desktop UX source: $required" }
          }

          $searchXaml = Get-Content "src/TuringDesk.Desktop/DesktopSearchBarWindow.xaml" -Raw
          if ($searchXaml -match 'Topmost="True"') { throw "Desktop search must stay below normal application windows" }
          if ($searchXaml -notmatch 'x:Name="ModelSelector"') { throw "Desktop search is missing the AI model selector" }
          if ($searchXaml -notmatch 'Text="设置"') { throw "Desktop search settings action must be visibly labeled" }
          if ($searchXaml -notmatch 'Text="语音"') { throw "Desktop search voice action must be visibly labeled" }
          if ($searchXaml -notmatch 'x:Name="SearchResultsList"') { throw "Desktop search is missing local application/file results" }

          $searchCode = Get-Content "src/TuringDesk.Desktop/DesktopSearchBarWindow.xaml.cs" -Raw
          if ($searchCode -notmatch "DesktopSearchIndexService") { throw "Desktop search is not connected to the local index" }
          if ($searchCode -notmatch "SubmitSearchCommandWithModelAsync") { throw "Desktop search bypasses its visible AI model selection" }

          $agentEntry = Get-Content "src/TuringDesk.Desktop/MainWindow.AgentEntry.cs" -Raw
          $modelSwitchIndex = $agentEntry.IndexOf("_runtime.ConfigureModelAsync(choice.Settings, choice.Credential)")
          $chatAfterSwitch = if ($modelSwitchIndex -ge 0) { $agentEntry.IndexOf("return await SubmitSearchCommandAsync(text, cancellationToken)", $modelSwitchIndex) } else { -1 }
          if ($modelSwitchIndex -lt 0 -or $chatAfterSwitch -lt 0 -or $modelSwitchIndex -gt $chatAfterSwitch) {
            throw "Desktop model picker does not configure Runtime before sending the AI request"
          }

          $modelChoices = Get-Content "src/TuringDesk.Desktop/Services/DesktopAiModelChoiceService.cs" -Raw
          if ($modelChoices -notmatch "deepseek-fallback") { throw "Desktop model picker has no DeepSeek fallback" }
          if ($modelChoices -notmatch "FirstOrDefault\(choice => choice\.IsAvailable\)") { throw "Desktop model picker does not prefer the first available configured model" }
          if ($modelChoices -notmatch "未配置 AI") { throw "Desktop model picker has no explicit no-model state" }

          $localIndex = Get-Content "src/TuringDesk.Desktop/Services/DesktopSearchIndexService.cs" -Raw
          if ($localIndex -notmatch "ShellSurfaceCatalog.LoadStartApps") { throw "Desktop search does not index installed Start Menu applications" }
          if ($localIndex -notmatch "FileSystemWatcher") { throw "Desktop text-file index is not incrementally refreshed" }

      - name: Verify scene host contract
        shell: pwsh
        run: |
          $catalog = Get-Content "src/TuringDesk.Desktop/Services/SceneEngine/SceneCatalogService.cs" -Raw
          foreach ($id in @("builtin:aurora", "builtin:neon", "builtin:orbit")) {
            if ($catalog -notmatch [regex]::Escape($id)) { throw "Missing built-in scene: $id" }
          }

          $desktopHost = Get-Content "src/TuringDesk.Desktop/Services/ExplorerDesktopHost.cs" -Raw
          foreach ($marker in @("workerw/progman-child", "workerw/classic-sibling", "BringWindowToTop", "VerifyAttachment", "HwndTop")) {
            if ($desktopHost -notmatch [regex]::Escape($marker)) { throw "Explorer scene host visibility contract missing: $marker" }
          }
          if ($desktopHost -match "HwndBottom") { throw "Scene HWND must not be pushed under Explorer's wallpaper child with HWND_BOTTOM" }

          $wallpaperHost = Get-Content "src/TuringDesk.Desktop/EnhancementWallpaperWindow.xaml.cs" -Raw
          if ($wallpaperHost -notmatch "AppearanceRequiresReload") { throw "Wallpaper host does not force reload when SceneId changes" }

      - name: Build Desktop and ShellHost
        shell: pwsh
        run: |
          dotnet restore src/TuringDesk.Desktop/TuringDesk.Desktop.csproj
          if ($LASTEXITCODE -ne 0) { throw "Desktop restore failed: $LASTEXITCODE" }
          dotnet build src/TuringDesk.Desktop/TuringDesk.Desktop.csproj --configuration Release --no-restore
          if ($LASTEXITCODE -ne 0) { throw "Desktop build failed: $LASTEXITCODE" }
          dotnet restore src/TuringDesk.ShellHost/TuringDesk.ShellHost.csproj
          if ($LASTEXITCODE -ne 0) { throw "ShellHost restore failed: $LASTEXITCODE" }
          dotnet build src/TuringDesk.ShellHost/TuringDesk.ShellHost.csproj --configuration Release --no-restore
          if ($LASTEXITCODE -ne 0) { throw "ShellHost build failed: $LASTEXITCODE" }

  package-win-arm64:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.package }}
    needs: [runtime, desktop-win-arm64]
    runs-on: windows-11-arm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.19.0
          architecture: arm64
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.424
      - run: corepack enable
      - run: corepack prepare pnpm@11.7.0 --activate
      - name: Build Windows ARM64 MSI
        shell: pwsh
        run: ./scripts/package-installer.ps1 -Version "v0.14.4" -RuntimeIdentifier "win-arm64"
      - name: Upload Windows ARM64 MSI
        uses: actions/upload-artifact@v4
        with:
          name: TuringDesk-v0.14.4-win-arm64-installer
          path: artifacts/TuringDesk-v0.14.4-win-arm64.msi
          if-no-files-found: error
          retention-days: 30
