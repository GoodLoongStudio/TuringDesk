name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      package:
        description: Build the Windows ARM64 MSI installer
        required: false
        default: false
        type: boolean

concurrency:
  group: turingdesk-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  runtime:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: runtime
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.19.0
      - run: corepack enable
      - run: corepack prepare pnpm@11.7.0 --activate
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm build
      - run: pnpm test:web

  desktop-win-arm64:
    needs: [runtime]
    runs-on: windows-11-arm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.424

      - name: Verify lightweight search and lazy Agent contract
        shell: pwsh
        run: |
          foreach ($required in @(
            "src/TuringDesk.Desktop/DesktopSearchBarWindow.xaml",
            "src/TuringDesk.Desktop/DesktopSearchBarWindow.xaml.cs",
            "src/TuringDesk.Desktop/MainWindow.AgentEntry.cs",
            "src/TuringDesk.Desktop/Services/DesktopSearchIndexService.cs",
            "src/TuringDesk.Desktop/Services/DesktopQuickAnswerService.cs",
            "src/TuringDesk.Desktop/Services/DesktopAiModelChoiceService.cs",
            "src/TuringDesk.Desktop/Services/HarnessWebUiService.cs"
          )) {
            if (-not (Test-Path $required)) { throw "Missing desktop source: $required" }
          }

          $searchXaml = Get-Content "src/TuringDesk.Desktop/DesktopSearchBarWindow.xaml" -Raw
          if ($searchXaml -match 'Topmost="True"') { throw "Desktop search must stay below normal application windows" }
          foreach ($marker in @('x:Name="ModelSelector"', 'x:Name="SearchResultsList"', 'x:Name="DeepProcessButton"', 'Text="设置"', 'Text="语音"')) {
            if ($searchXaml -notmatch [regex]::Escape($marker)) { throw "Desktop search XAML contract missing: $marker" }
          }

          $searchCode = Get-Content "src/TuringDesk.Desktop/DesktopSearchBarWindow.xaml.cs" -Raw
          foreach ($marker in @("DesktopSearchIndexService", "DesktopQuickAnswerService", "SearchApps(", "SearchFilesAsync(", "CancellationTokenSource", "FileSearchDebounce", "Task.Delay(FileSearchDebounce", "ShowHarnessConsoleFromSearch")) {
            if ($searchCode -notmatch [regex]::Escape($marker)) { throw "Tiered desktop search contract missing: $marker" }
          }
          if ($searchCode -match "SubmitSearchCommandWithModelAsync") {
            throw "Desktop search must not automatically enter the heavy Runtime/Harness chat path"
          }

          $localIndex = Get-Content "src/TuringDesk.Desktop/Services/DesktopSearchIndexService.cs" -Raw
          foreach ($marker in @("ShellSurfaceCatalog.LoadStartApps", "FileSystemWatcher", "PinyinConvert.GetPinyin", "PinyinConvert.GetPinyinFirstLetter", "SearchApps", "SearchFilesAsync", "_filePrefixIndex", "Task.Run")) {
            if ($localIndex -notmatch [regex]::Escape($marker)) { throw "Search index contract missing: $marker" }
          }

          $desktopProject = Get-Content "src/TuringDesk.Desktop/TuringDesk.Desktop.csproj" -Raw
          if ($desktopProject -notmatch 'PackageReference Include="PinyinNet" Version="1.0.0"') {
            throw "Desktop pinyin index must use the pinned PinyinNet package"
          }
          if ($desktopProject -notmatch '<ApplicationManifest>app.manifest</ApplicationManifest>') {
            throw "Desktop process must embed the PerMonitorV2 manifest"
          }
          $manifest = Get-Content "src/TuringDesk.Desktop/app.manifest" -Raw
          if ($manifest -notmatch 'PerMonitorV2,PerMonitor') { throw "Desktop process is not PerMonitorV2 DPI-aware" }

          $quick = Get-Content "src/TuringDesk.Desktop/Services/DesktopQuickAnswerService.cs" -Raw
          if ($quick -match "HarnessWebUiService") {
            throw "Level-3 quick answers must not wake Harness"
          }
          foreach ($marker in @("TryCalculate", "QuickIntent.Translate", "QuickIntent.Explain", "chat/completions")) {
            if ($quick -notmatch [regex]::Escape($marker)) { throw "Lightweight direct-answer contract missing: $marker" }
          }

          $appStartup = Get-Content "src/TuringDesk.Desktop/App.xaml.cs" -Raw
          if ($appStartup -match "HarnessWebUiService.StartEarly") { throw "App startup must not eagerly start Harness" }

          $mainWindow = Get-Content "src/TuringDesk.Desktop/MainWindow.xaml.cs" -Raw
          if ($mainWindow -match "RuntimeHostService|RuntimeClient") { throw "MainWindow must not reference legacy Runtime" }

          # Verify removed files do not exist
          foreach ($removed in @(
            "src/TuringDesk.Desktop/Services/RuntimeClient.cs",
            "src/TuringDesk.Desktop/Services/RuntimeHostService.cs",
            "src/TuringDesk.Desktop/Services/CapabilityServer.cs",
            "src/TuringDesk.Desktop/Services/AgentFloatingCardsService.cs",
            "runtime/src/server.ts",
            "runtime/src/windows-mcp-server.ts",
            "runtime/harness/turingdesk.cordis.yml"
          )) {
            if (Test-Path $removed) { throw "Legacy file must be deleted: $removed" }
          }

          $harnessWeb = Get-Content "src/TuringDesk.Desktop/Services/HarnessWebUiService.cs" -Raw
          $applyStart = $harnessWeb.IndexOf("ApplyModelSettingsAsync")
          if ($applyStart -lt 0) { throw "Harness model synchronization method missing" }
          $applySlice = $harnessWeb.Substring($applyStart, [Math]::Min(1200, $harnessWeb.Length - $applyStart))
          if ($applySlice -match "EnsureRunningAsync") { throw "Saving model settings must not wake a cold Harness WebUI" }
          if ($harnessWeb -match "windows-mcp|turingdesk-web\.patch") { throw "Harness WebUI must not inject old Windows MCP" }

      - name: Verify mixed-DPI desktop host and zero-power scene contract
        shell: pwsh
        run: |
          $catalog = Get-Content "src/TuringDesk.Desktop/Services/SceneEngine/SceneCatalogService.cs" -Raw
          foreach ($id in @("builtin:aurora", "builtin:neon", "builtin:orbit")) {
            if ($catalog -notmatch [regex]::Escape($id)) { throw "Missing built-in scene: $id" }
          }

          $display = Get-Content "src/TuringDesk.Desktop/Services/DisplayManager.cs" -Raw
          foreach ($marker in @("DeviceName", "DpiX", "DpiY", "GetDpiForMonitor", "GetSignature", "ScaleX", "ScaleY")) {
            if ($display -notmatch [regex]::Escape($marker)) { throw "Mixed-DPI display contract missing: $marker" }
          }

          $desktopHost = Get-Content "src/TuringDesk.Desktop/Services/ExplorerDesktopHost.cs" -Raw
          foreach ($marker in @("progman/behind-defview", "workerw/progman-child", "workerw/classic-sibling", "SysListView32", "ExplorerProcessId", "CaptureDesktopGeneration", "InvalidateAll", "MapWindowPoints", "BringWindowToTop", "VerifyAttachment", "HwndTop")) {
            if ($desktopHost -notmatch [regex]::Escape($marker)) { throw "Explorer desktop-generation contract missing: $marker" }
          }
          if ($desktopHost -match "HwndBottom") { throw "Scene HWND must not be pushed under Explorer's wallpaper child with HWND_BOTTOM" }

          $wallpaperHost = Get-Content "src/TuringDesk.Desktop/EnhancementWallpaperWindow.xaml.cs" -Raw
          foreach ($marker in @("WmDpiChanged", "WmDisplayChange", "UpdateMonitor", "_sceneLoadGate", "WaitAsync(cancellation.Token)", "AppearanceRequiresReload")) {
            if ($wallpaperHost -notmatch [regex]::Escape($marker)) { throw "Wallpaper rebind/lifecycle contract missing: $marker" }
          }

          $enhancement = Get-Content "src/TuringDesk.Desktop/MainWindow.EnhancementMode.cs" -Raw
          foreach ($marker in @("TaskbarCreated", "WtsSessionUnlock", "WmDisplayChange", "WmDpiChanged", "ReconcileEnhancementMonitors", "ExplorerDesktopHost.InvalidateAll")) {
            if ($enhancement -notmatch [regex]::Escape($marker)) { throw "Enhancement recovery contract missing: $marker" }
          }

          $renderer = Get-Content "src/TuringDesk.Desktop/SceneRendererControl.xaml.cs" -Raw
          foreach ($marker in @("StopSceneScript", "ShutdownAudioBridge", "GpuSurface.StopRendering", "ReleaseAudioBridge", "_desktopInputTimer.Stop")) {
            if ($renderer -notmatch [regex]::Escape($marker)) { throw "Scene teardown/pause contract missing: $marker" }
          }

          $gpu = Get-Content "src/TuringDesk.Desktop/GpuSceneSurface.cs" -Raw
          foreach ($marker in @("AlwaysRefresh = false", "UpdateRefreshMode", "StopRendering", "SetPaused")) {
            if ($gpu -notmatch [regex]::Escape($marker)) { throw "GPU zero-refresh contract missing: $marker" }
          }

          $fullscreen = Get-Content "src/TuringDesk.Desktop/Services/DesktopScenePerformancePolicy.cs" -Raw
          foreach ($marker in @("DwmwaExtendedFrameBounds", "DwmwaCloaked", "MonitorFromWindow", "GetDpiForWindow", "coverage >= 0.995")) {
            if ($fullscreen -notmatch [regex]::Escape($marker)) { throw "Fullscreen detection contract missing: $marker" }
          }

      - name: Build Desktop and ShellHost
        shell: pwsh
        run: |
          dotnet restore src/TuringDesk.Desktop/TuringDesk.Desktop.csproj
          if ($LASTEXITCODE -ne 0) { throw "Desktop restore failed: $LASTEXITCODE" }
          dotnet build src/TuringDesk.Desktop/TuringDesk.Desktop.csproj --configuration Release --no-restore
          if ($LASTEXITCODE -ne 0) { throw "Desktop build failed: $LASTEXITCODE" }
          dotnet restore src/TuringDesk.ShellHost/TuringDesk.ShellHost.csproj
          if ($LASTEXITCODE -ne 0) { throw "ShellHost restore failed: $LASTEXITCODE" }
          dotnet build src/TuringDesk.ShellHost/TuringDesk.ShellHost.csproj --configuration Release --no-restore
          if ($LASTEXITCODE -ne 0) { throw "ShellHost build failed: $LASTEXITCODE" }

  package-win-arm64:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.package }}
    needs: [runtime, desktop-win-arm64]
    runs-on: windows-11-arm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.19.0
          architecture: arm64
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.424
      - run: corepack enable
      - run: corepack prepare pnpm@11.7.0 --activate
      - name: Build Windows ARM64 MSI
        shell: pwsh
        run: ./scripts/package-installer.ps1 -Version "v0.14.4" -RuntimeIdentifier "win-arm64"
      - name: Upload Windows ARM64 MSI
        uses: actions/upload-artifact@v4
        with:
          name: TuringDesk-v0.14.4-win-arm64-installer
          path: artifacts/TuringDesk-v0.14.4-win-arm64.msi
          if-no-files-found: error
          retention-days: 30
