name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      package:
        description: Build the Windows ARM64 MSI installer
        required: false
        default: false
        type: boolean

concurrency:
  group: turingdesk-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  runtime:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: runtime
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.19.0
      - run: corepack enable
      - run: corepack prepare pnpm@11.7.0 --activate
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm build
      - run: pnpm test:mcp
      - name: Boot bundled DeepSeek Harness + TuringDesk MCP
        run: pnpm test:harness

  desktop-win-arm64:
    needs: [runtime]
    runs-on: windows-11-arm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.424

      - name: Verify lightweight search and lazy Agent contract
        shell: pwsh
        run: |
          foreach ($required in @(
            "src/TuringDesk.Desktop/DesktopSearchBarWindow.xaml",
            "src/TuringDesk.Desktop/DesktopSearchBarWindow.xaml.cs",
            "src/TuringDesk.Desktop/MainWindow.AgentEntry.cs",
            "src/TuringDesk.Desktop/Services/DesktopSearchIndexService.cs",
            "src/TuringDesk.Desktop/Services/DesktopQuickAnswerService.cs",
            "src/TuringDesk.Desktop/Services/DesktopAiModelChoiceService.cs",
            "src/TuringDesk.Desktop/Services/RuntimeHostService.cs",
            "src/TuringDesk.Desktop/Services/RuntimeClient.cs",
            "src/TuringDesk.Desktop/Services/HarnessWebUiService.cs"
          )) {
            if (-not (Test-Path $required)) { throw "Missing desktop source: $required" }
          }

          $searchXaml = Get-Content "src/TuringDesk.Desktop/DesktopSearchBarWindow.xaml" -Raw
          if ($searchXaml -match 'Topmost="True"') { throw "Desktop search must stay below normal application windows" }
          foreach ($marker in @('x:Name="ModelSelector"'.Replace('\',''), 'x:Name="SearchResultsList"'.Replace('\',''), 'x:Name="DeepProcessButton"'.Replace('\',''), 'Text="设置"'.Replace('\',''), 'Text="语音"'.Replace('\',''))) {
            if ($searchXaml -notmatch [regex]::Escape($marker)) { throw "Desktop search XAML contract missing: $marker" }
          }

          $searchCode = Get-Content "src/TuringDesk.Desktop/DesktopSearchBarWindow.xaml.cs" -Raw
          foreach ($marker in @("DesktopSearchIndexService", "DesktopQuickAnswerService", "SearchApps(", "SearchFilesAsync(", "CancellationTokenSource", "ShowHarnessConsoleFromSearch")) {
            if ($searchCode -notmatch [regex]::Escape($marker)) { throw "Tiered desktop search contract missing: $marker" }
          }
          if ($searchCode -match "SubmitSearchCommandWithModelAsync") {
            throw "Desktop search must not automatically enter the heavy Runtime/Harness chat path"
          }

          $localIndex = Get-Content "src/TuringDesk.Desktop/Services/DesktopSearchIndexService.cs" -Raw
          foreach ($marker in @("ShellSurfaceCatalog.LoadStartApps", "FileSystemWatcher", "Pinyin.GetPinyin", "SearchApps", "SearchFilesAsync", "Task.Run")) {
            if ($localIndex -notmatch [regex]::Escape($marker)) { throw "Search index contract missing: $marker" }
          }

          $quick = Get-Content "src/TuringDesk.Desktop/Services/DesktopQuickAnswerService.cs" -Raw
          if ($quick -match "RuntimeHostService|HarnessWebUiService") {
            throw "Level-3 quick answers must not wake Runtime or Harness"
          }
          foreach ($marker in @("TryCalculate", "QuickIntent.Translate", "QuickIntent.Explain", "chat/completions")) {
            if ($quick -notmatch [regex]::Escape($marker)) { throw "Lightweight direct-answer contract missing: $marker" }
          }

          $appStartup = Get-Content "src/TuringDesk.Desktop/App.xaml.cs" -Raw
          if ($appStartup -match "HarnessWebUiService.StartEarly") { throw "App startup must not eagerly start Harness" }

          $mainWindow = Get-Content "src/TuringDesk.Desktop/MainWindow.xaml.cs" -Raw
          if ($mainWindow -match "RuntimeHostService.EnsureRunningAsync") { throw "MainWindow startup must not eagerly start Runtime" }
          if ($mainWindow -match "StartHarnessServiceAsync") { throw "MainWindow startup must not prewarm Harness" }

          $runtimeClient = Get-Content "src/TuringDesk.Desktop/Services/RuntimeClient.cs" -Raw
          foreach ($marker in @("RuntimeHostService.AcquireAsync", "RuntimeStartReason.AgentRequest", "RuntimeStartReason.ModelConfiguration")) {
            if ($runtimeClient -notmatch [regex]::Escape($marker)) { throw "RuntimeClient lazy lease contract missing: $marker" }
          }

          $runtimeHost = Get-Content "src/TuringDesk.Desktop/Services/RuntimeHostService.cs" -Raw
          foreach ($marker in @("EnsureRuntimeStartedAsync", "AcquireAsync", "IdleTimeout", "v1/runtime/shutdown", "NotifyWorkbenchOpened", "NotifyWorkbenchClosed")) {
            if ($runtimeHost -notmatch [regex]::Escape($marker)) { throw "Runtime lifecycle contract missing: $marker" }
          }

          $harnessWeb = Get-Content "src/TuringDesk.Desktop/Services/HarnessWebUiService.cs" -Raw
          $applyStart = $harnessWeb.IndexOf("ApplyModelSettingsAsync")
          if ($applyStart -lt 0) { throw "Harness model synchronization method missing" }
          $applySlice = $harnessWeb.Substring($applyStart, [Math]::Min(1200, $harnessWeb.Length - $applyStart))
          if ($applySlice -match "EnsureRunningAsync") { throw "Saving model settings must not wake a cold Harness WebUI" }

          $mcp = Get-Content "runtime/src/windows-mcp-server.ts" -Raw
          foreach ($marker in @("executionClass", "instant", "interactive", "requiresAgentPlanning")) {
            if ($mcp -notmatch [regex]::Escape($marker)) { throw "Windows MCP routing metadata missing: $marker" }
          }

      - name: Verify scene host contract
        shell: pwsh
        run: |
          $catalog = Get-Content "src/TuringDesk.Desktop/Services/SceneEngine/SceneCatalogService.cs" -Raw
          foreach ($id in @("builtin:aurora", "builtin:neon", "builtin:orbit")) {
            if ($catalog -notmatch [regex]::Escape($id)) { throw "Missing built-in scene: $id" }
          }

          $desktopHost = Get-Content "src/TuringDesk.Desktop/Services/ExplorerDesktopHost.cs" -Raw
          foreach ($marker in @("workerw/progman-child", "workerw/classic-sibling", "BringWindowToTop", "VerifyAttachment", "HwndTop")) {
            if ($desktopHost -notmatch [regex]::Escape($marker)) { throw "Explorer scene host visibility contract missing: $marker" }
          }
          if ($desktopHost -match "HwndBottom") { throw "Scene HWND must not be pushed under Explorer's wallpaper child with HWND_BOTTOM" }

          $wallpaperHost = Get-Content "src/TuringDesk.Desktop/EnhancementWallpaperWindow.xaml.cs" -Raw
          if ($wallpaperHost -notmatch "AppearanceRequiresReload") { throw "Wallpaper host does not force reload when SceneId changes" }

      - name: Build Desktop and ShellHost
        shell: pwsh
        run: |
          dotnet restore src/TuringDesk.Desktop/TuringDesk.Desktop.csproj
          if ($LASTEXITCODE -ne 0) { throw "Desktop restore failed: $LASTEXITCODE" }
          dotnet build src/TuringDesk.Desktop/TuringDesk.Desktop.csproj --configuration Release --no-restore
          if ($LASTEXITCODE -ne 0) { throw "Desktop build failed: $LASTEXITCODE" }
          dotnet restore src/TuringDesk.ShellHost/TuringDesk.ShellHost.csproj
          if ($LASTEXITCODE -ne 0) { throw "ShellHost restore failed: $LASTEXITCODE" }
          dotnet build src/TuringDesk.ShellHost/TuringDesk.ShellHost.csproj --configuration Release --no-restore
          if ($LASTEXITCODE -ne 0) { throw "ShellHost build failed: $LASTEXITCODE" }

  package-win-arm64:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.package }}
    needs: [runtime, desktop-win-arm64]
    runs-on: windows-11-arm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.19.0
          architecture: arm64
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.424
      - run: corepack enable
      - run: corepack prepare pnpm@11.7.0 --activate
      - name: Build Windows ARM64 MSI
        shell: pwsh
        run: ./scripts/package-installer.ps1 -Version "v0.14.4" -RuntimeIdentifier "win-arm64"
      - name: Upload Windows ARM64 MSI
        uses: actions/upload-artifact@v4
        with:
          name: TuringDesk-v0.14.4-win-arm64-installer
          path: artifacts/TuringDesk-v0.14.4-win-arm64.msi
          if-no-files-found: error
          retention-days: 30
