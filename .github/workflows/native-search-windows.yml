name: Native Windows ARM64

on:
  push:
    branches: [main]
    paths:
      - CMakeLists.txt
      - src/native/**
      - runtime/arm64/**
      - scripts/prepare-third-party-runtime-arm64.ps1
      - scripts/verify-arm64-runtime-bundle.ps1
      - .github/workflows/native-search-windows.yml
  workflow_run:
    workflows: ["Vendor ARM64 Runtime Bundle"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: native-arm64-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  build-arm64:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: windows-11-arm
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main

      - name: Verify repository ARM64 RuntimeBundle
        shell: pwsh
        run: |
          .\scripts\verify-arm64-runtime-bundle.ps1

      - name: Configure ARM64 offline
        run: cmake -S . -B build -A ARM64

      - name: Build ARM64
        run: cmake --build build --config Release --parallel

      - name: Native Search self-test
        shell: pwsh
        run: |
          $p = Start-Process -FilePath ".\build\src\native\Release\TuringDesk.exe" -ArgumentList "--self-test" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "Native Search self-test failed: $($p.ExitCode)" }

      - name: Native Wallpaper self-test
        shell: pwsh
        run: |
          $p = Start-Process -FilePath ".\build\src\native\Release\TuringDeskWallpaper.exe" -ArgumentList "--self-test" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "Native Wallpaper self-test failed: $($p.ExitCode)" }

      - name: Native Harness shell self-test
        shell: pwsh
        run: |
          $p = Start-Process -FilePath ".\build\src\native\Release\TuringDeskHarness.exe" -ArgumentList "--self-test" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "Native Harness shell self-test failed: $($p.ExitCode)" }

      - name: Prepare self-contained ARM64 smoke package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path build/package | Out-Null
          Copy-Item build/src/native/Release/TuringDesk.exe build/package/TuringDesk.exe -Force
          Copy-Item build/src/native/Release/TuringDeskWallpaper.exe build/package/TuringDeskWallpaper.exe -Force
          Copy-Item build/src/native/Release/TuringDeskHarness.exe build/package/TuringDeskHarness.exe -Force
          .\scripts\prepare-third-party-runtime-arm64.ps1 -DeployDir (Resolve-Path build/package).Path

      - name: Redeploy while unchanged bundled Everything is running
        shell: pwsh
        run: |
          $package = (Resolve-Path 'build/package').Path
          $everything = Join-Path $package 'Everything\Everything.exe'
          $config = Join-Path $package 'Everything\TuringDesk-Everything.ini'
          if (-not (Test-Path $everything -PathType Leaf)) { throw 'Bundled Everything is missing before replacement test' }
          $beforeHash = (Get-FileHash -Algorithm SHA256 $everything).Hash

          Start-Process -FilePath $everything -ArgumentList "-config `"$config`" -startup" | Out-Null
          Start-Sleep -Seconds 1
          $running = Get-CimInstance Win32_Process -Filter "Name='Everything.exe'" -ErrorAction SilentlyContinue |
            Where-Object { $_.ExecutablePath -and ([System.IO.Path]::GetFullPath($_.ExecutablePath) -eq [System.IO.Path]::GetFullPath($everything)) }
          if (-not $running) { throw 'Bundled Everything did not stay running for redeploy regression test' }

          # Force the installer through its refresh path while the exact vendored
          # Everything binary is image-mapped. It must preserve that unchanged EXE.
          Set-Content (Join-Path $package 'Runtime\runtime-manifest.sha256') -Value 'force-redeploy' -Encoding ASCII
          .\scripts\prepare-third-party-runtime-arm64.ps1 -DeployDir $package

          $stillRunning = Get-CimInstance Win32_Process -Filter "Name='Everything.exe'" -ErrorAction SilentlyContinue |
            Where-Object { $_.ExecutablePath -and ([System.IO.Path]::GetFullPath($_.ExecutablePath) -eq [System.IO.Path]::GetFullPath($everything)) }
          if (-not $stillRunning) { throw 'Unchanged bundled Everything was unnecessarily stopped during runtime refresh' }
          if (-not (Test-Path $everything -PathType Leaf)) { throw 'Bundled Everything disappeared during runtime refresh' }
          $afterHash = (Get-FileHash -Algorithm SHA256 $everything).Hash
          if ($afterHash -ne $beforeHash) { throw 'Bundled Everything changed during unchanged-component refresh' }
          & $everything -config $config -quit 2>$null | Out-Null

      - name: Validate deployed ARM64 package
        shell: pwsh
        run: |
          foreach ($test in @(
            @{ Exe = '.\build\package\TuringDesk.exe'; Args = '--self-test'; Name = 'Search' },
            @{ Exe = '.\build\package\TuringDeskWallpaper.exe'; Args = '--self-test'; Name = 'Wallpaper' },
            @{ Exe = '.\build\package\TuringDeskHarness.exe'; Args = '--self-test'; Name = 'Harness shell' }
          )) {
            $p = Start-Process -FilePath $test.Exe -ArgumentList $test.Args -Wait -PassThru
            if ($p.ExitCode -ne 0) { throw "$($test.Name) package self-test failed: $($p.ExitCode)" }
          }

      - name: Real bundled DeepSeek Harness smoke test
        shell: pwsh
        run: |
          $p = Start-Process -FilePath '.\build\package\TuringDeskHarness.exe' -ArgumentList '--harness-smoke-test' -Wait -PassThru
          if ($p.ExitCode -ne 0) {
            $log = Join-Path $env:LOCALAPPDATA 'TuringDesk\Logs\harness.log'
            if (Test-Path $log) { Get-Content $log -Tail 200 | Out-Host }
            throw "Bundled DeepSeek Harness smoke test failed: $($p.ExitCode)"
          }

      - name: Prepare compact ARM64 artifact
        shell: pwsh
        run: |
          Remove-Item build/package/Runtime -Recurse -Force -ErrorAction SilentlyContinue
          Remove-Item build/package/Everything -Recurse -Force -ErrorAction SilentlyContinue
          Remove-Item build/package/Codex -Recurse -Force -ErrorAction SilentlyContinue

      - uses: actions/upload-artifact@v4
        with:
          name: TuringDesk-Native-Search-ARM64
          path: build/package/**
          retention-days: 3

  report:
    if: always()
    needs: [build-arm64]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ci-status
      - name: Write isolated ARM64 CI status
        shell: bash
        env:
          ARM64_RESULT: ${{ needs.build-arm64.result }}
        run: |
          mkdir -p ci
          cat > "ci/native-${GITHUB_SHA}.json" <<EOF
          {
            "sha": "${GITHUB_SHA}",
            "mode": "native-arm64-only-offline-runtime",
            "x64": "disabled",
            "arm64": "${ARM64_RESULT}",
            "run_id": "${GITHUB_RUN_ID}"
          }
          EOF
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "ci/native-${GITHUB_SHA}.json"
          git commit -m "ci: report ARM64 native build ${GITHUB_SHA}" || exit 0
          for i in 1 2 3; do
            git pull --rebase origin ci-status || true
            if git push origin HEAD:ci-status; then exit 0; fi
            sleep 2
          done
          exit 1
