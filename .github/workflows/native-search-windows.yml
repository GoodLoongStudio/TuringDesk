name: Native Windows ARM64

on:
  push:
    branches: [main]
    paths:
      - CMakeLists.txt
      - src/native/**
      - runtime/arm64/**
      - scripts/prepare-third-party-runtime-arm64.ps1
      - scripts/verify-arm64-runtime-bundle.ps1
      - .github/workflows/native-search-windows.yml
  workflow_run:
    workflows: ["Vendor ARM64 Runtime Bundle"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: native-windows-arm64
  cancel-in-progress: true

jobs:
  build-arm64:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: windows-11-arm
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main

      - name: Check RuntimeBundle freshness
        id: bundle
        shell: pwsh
        run: |
          $lock = 'runtime/arm64/runtime-lock.json'
          $manifest = 'runtime/arm64/runtime-manifest.json'
          $ready = $false
          if ((Test-Path $lock) -and (Test-Path $manifest)) {
            $hash = (Get-FileHash -Algorithm SHA256 $lock).Hash.ToLowerInvariant()
            $m = Get-Content $manifest -Raw | ConvertFrom-Json
            $ready = ([int]$m.schema -ge 2) -and ($m.lockSha256 -eq $hash)
          }
          "ready=$($ready.ToString().ToLowerInvariant())" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          if (-not $ready) {
            throw 'ARM64 RuntimeBundle is stale or incomplete. Vendor ARM64 Runtime Bundle must succeed before native validation can pass.'
          }

      - name: Verify repository ARM64 RuntimeBundle
        shell: pwsh
        run: .\scripts\verify-arm64-runtime-bundle.ps1

      - name: Configure ARM64 offline
        run: cmake -S . -B build -A ARM64

      - name: Build ARM64
        run: cmake --build build --config Release --parallel

      - name: Native self-tests
        shell: pwsh
        run: |
          foreach ($test in @(
            @{ Exe = '.\build\src\native\Release\TuringDesk.exe'; Name = 'Search' },
            @{ Exe = '.\build\src\native\Release\TuringDeskWallpaper.exe'; Name = 'Wallpaper' },
            @{ Exe = '.\build\src\native\Release\TuringDeskHarness.exe'; Name = 'Harness shell' }
          )) {
            $p = Start-Process -FilePath $test.Exe -ArgumentList '--self-test' -Wait -PassThru
            if ($p.ExitCode -ne 0) { throw "$($test.Name) self-test failed: $($p.ExitCode)" }
          }

      - name: Prepare self-contained ARM64 smoke package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path build/package | Out-Null
          Copy-Item build/src/native/Release/TuringDesk.exe build/package/TuringDesk.exe -Force
          Copy-Item build/src/native/Release/TuringDeskWallpaper.exe build/package/TuringDeskWallpaper.exe -Force
          Copy-Item build/src/native/Release/TuringDeskHarness.exe build/package/TuringDeskHarness.exe -Force
          .\scripts\prepare-third-party-runtime-arm64.ps1 -DeployDir (Resolve-Path build/package).Path -SkipGozServiceInstall

      - name: Validate full Codex CLI runtime
        shell: pwsh
        run: |
          $codex = '.\build\package\Codex\codex.exe'
          & $codex --version | Out-Host
          if ($LASTEXITCODE -ne 0) { throw 'Bundled Codex CLI --version failed' }
          & $codex app-server --help | Out-Host
          if ($LASTEXITCODE -ne 0) { throw 'Bundled Codex CLI app-server command failed' }

      - name: Real goz MFT/USN integration test
        shell: pwsh
        run: |
          $goz = (Resolve-Path '.\build\package\Goz\goz.exe').Path
          $gozd = (Resolve-Path '.\build\package\Goz\gozd.exe').Path
          $probe = "turingdesk-goz-ci-$env:GITHUB_RUN_ID.txt"
          $probePath = Join-Path $env:USERPROFILE $probe
          Set-Content $probePath -Value 'TuringDesk goz integration probe' -Encoding UTF8
          try {
            & $gozd install | Out-Host
            if ($LASTEXITCODE -ne 0) { throw 'gozd service install failed on ARM64 runner' }
            $found = $false
            for ($i = 0; $i -lt 90; $i++) {
              $result = (& $goz -n 20 $probe 2>$null | Out-String)
              if ($LASTEXITCODE -eq 0 -and $result -match [regex]::Escape($probe)) { $found = $true; break }
              Start-Sleep -Seconds 1
            }
            if (-not $found) { throw 'goz did not return the USN/MFT probe file on ARM64' }
            & $goz --status | Out-Host
          }
          finally {
            Remove-Item $probePath -Force -ErrorAction SilentlyContinue
            & $gozd uninstall | Out-Host
          }

      - name: Real bundled DeepSeek Harness smoke test
        shell: pwsh
        run: |
          $p = Start-Process -FilePath '.\build\package\TuringDeskHarness.exe' -ArgumentList '--harness-smoke-test' -Wait -PassThru
          if ($p.ExitCode -ne 0) {
            $log = Join-Path $env:LOCALAPPDATA 'TuringDesk\Logs\harness.log'
            if (Test-Path $log) { Get-Content $log -Tail 200 | Out-Host }
            throw "Bundled DeepSeek Harness smoke test failed: $($p.ExitCode)"
          }

      - name: Prepare compact ARM64 artifact
        shell: pwsh
        run: |
          Remove-Item build/package/Runtime -Recurse -Force -ErrorAction SilentlyContinue
          Remove-Item build/package/Goz -Recurse -Force -ErrorAction SilentlyContinue
          Remove-Item build/package/Codex -Recurse -Force -ErrorAction SilentlyContinue

      - uses: actions/upload-artifact@v4
        with:
          name: TuringDesk-Native-Search-ARM64
          path: build/package/**
          retention-days: 3

  report:
    if: always()
    needs: [build-arm64]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ci-status
      - name: Write native CI status
        shell: bash
        env:
          ARM64_RESULT: ${{ needs.build-arm64.result }}
        run: |
          mkdir -p ci
          cat > "ci/native-${GITHUB_SHA}.json" <<EOF
          {
            "sha": "${GITHUB_SHA}",
            "mode": "native-arm64-goz-codex-cli",
            "arm64": "${ARM64_RESULT}",
            "run_id": "${GITHUB_RUN_ID}"
          }
          EOF
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "ci/native-${GITHUB_SHA}.json"
          git commit -m "ci: report native ARM64 build ${GITHUB_SHA}" || exit 0
          for i in 1 2 3; do
            git pull --rebase origin ci-status || true
            if git push origin HEAD:ci-status; then exit 0; fi
            sleep 2
          done
          exit 1
