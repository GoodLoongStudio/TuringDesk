name: Native Search Windows

on:
  push:
    branches: [main]
    paths:
      - CMakeLists.txt
      - src/native/**
      - .github/workflows/native-search-windows.yml
  workflow_dispatch:

permissions:
  contents: write

env:
  EVERYTHING_VERSION: 1.5.0.1422b

jobs:
  build-x64:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - name: Configure x64
        run: cmake -S . -B build -A x64
      - name: Build x64
        run: cmake --build build --config Release --parallel
      - name: Native Search self-test
        run: .\build\src\native\Release\TuringDesk.exe --self-test
      - name: Package x64 with Everything and Wallpaper
        shell: pwsh
        run: |
          $package = "build/package"
          $everything = Join-Path $package "Everything"
          New-Item -ItemType Directory -Force -Path $everything | Out-Null
          Copy-Item "build/src/native/Release/TuringDesk.exe" (Join-Path $package "TuringDesk.exe") -Force
          Copy-Item "build/src/native/Release/TuringDeskWallpaper.exe" (Join-Path $package "TuringDeskWallpaper.exe") -Force
          $zip = Join-Path $env:RUNNER_TEMP "Everything-x64.zip"
          Invoke-WebRequest "https://www.voidtools.com/Everything-$env:EVERYTHING_VERSION.x64.zip" -OutFile $zip
          Expand-Archive $zip -DestinationPath $everything -Force
          Invoke-WebRequest "https://www.voidtools.com/License.txt" -OutFile (Join-Path $everything "LICENSE.txt")
      - name: Verify packaged x64 runtime
        shell: pwsh
        run: |
          $package = "build/package"
          $required = @(
            (Join-Path $package "TuringDesk.exe"),
            (Join-Path $package "TuringDeskWallpaper.exe"),
            (Join-Path $package "Everything\Everything.exe"),
            (Join-Path $package "Everything\LICENSE.txt")
          )
          foreach ($path in $required) {
            if (-not (Test-Path $path -PathType Leaf)) { throw "Missing packaged file: $path" }
          }
          & (Join-Path $package "TuringDesk.exe") --self-test
          if ($LASTEXITCODE -ne 0) { throw "Packaged TuringDesk self-test failed: $LASTEXITCODE" }
      - uses: actions/upload-artifact@v4
        with:
          name: TuringDesk-Native-Search-x64
          path: build/package/**

  build-arm64:
    runs-on: windows-11-arm
    steps:
      - uses: actions/checkout@v5
      - name: Configure ARM64
        run: cmake -S . -B build -A ARM64
      - name: Build ARM64
        run: cmake --build build --config Release --parallel
      - name: Native Search self-test
        run: .\build\src\native\Release\TuringDesk.exe --self-test
      - name: Package ARM64 with Everything and Wallpaper
        shell: pwsh
        run: |
          $package = "build/package"
          $everything = Join-Path $package "Everything"
          New-Item -ItemType Directory -Force -Path $everything | Out-Null
          Copy-Item "build/src/native/Release/TuringDesk.exe" (Join-Path $package "TuringDesk.exe") -Force
          Copy-Item "build/src/native/Release/TuringDeskWallpaper.exe" (Join-Path $package "TuringDeskWallpaper.exe") -Force
          $zip = Join-Path $env:RUNNER_TEMP "Everything-ARM64.zip"
          Invoke-WebRequest "https://www.voidtools.com/Everything-$env:EVERYTHING_VERSION.ARM64.zip" -OutFile $zip
          Expand-Archive $zip -DestinationPath $everything -Force
          Invoke-WebRequest "https://www.voidtools.com/License.txt" -OutFile (Join-Path $everything "LICENSE.txt")
      - name: Verify packaged ARM64 runtime
        shell: pwsh
        run: |
          $package = "build/package"
          $required = @(
            (Join-Path $package "TuringDesk.exe"),
            (Join-Path $package "TuringDeskWallpaper.exe"),
            (Join-Path $package "Everything\Everything.exe"),
            (Join-Path $package "Everything\LICENSE.txt")
          )
          foreach ($path in $required) {
            if (-not (Test-Path $path -PathType Leaf)) { throw "Missing packaged file: $path" }
          }
          & (Join-Path $package "TuringDesk.exe") --self-test
          if ($LASTEXITCODE -ne 0) { throw "Packaged TuringDesk self-test failed: $LASTEXITCODE" }
      - uses: actions/upload-artifact@v4
        with:
          name: TuringDesk-Native-Search-ARM64
          path: build/package/**

  report:
    if: always()
    needs: [build-x64, build-arm64]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ci-status
      - name: Write isolated CI status
        shell: bash
        env:
          X64_RESULT: ${{ needs.build-x64.result }}
          ARM64_RESULT: ${{ needs.build-arm64.result }}
        run: |
          mkdir -p ci
          cat > "ci/native-${GITHUB_SHA}.json" <<EOF
          {
            "sha": "${GITHUB_SHA}",
            "x64": "${X64_RESULT}",
            "arm64": "${ARM64_RESULT}",
            "run_id": "${GITHUB_RUN_ID}"
          }
          EOF
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "ci/native-${GITHUB_SHA}.json"
          git commit -m "ci: report native build ${GITHUB_SHA}" || exit 0
          for i in 1 2 3; do
            git pull --rebase origin ci-status || true
            if git push origin HEAD:ci-status; then exit 0; fi
            sleep 2
          done
          exit 1
