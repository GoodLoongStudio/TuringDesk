name: Native Search Windows

on:
  push:
    branches: [main]
    paths:
      - CMakeLists.txt
      - src/native/**
      - .github/workflows/native-search-windows.yml
  workflow_dispatch:

jobs:
  build-x64:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure x64
        run: cmake -S . -B build -A x64
      - name: Build x64
        run: cmake --build build --config Release --parallel
      - name: Native Search self-test
        run: .\build\src\native\Release\TuringDesk.exe --self-test
      - uses: actions/upload-artifact@v4
        with:
          name: TuringDesk-Native-Search-x64
          path: build/src/native/Release/TuringDesk.exe

  build-arm64:
    runs-on: windows-11-arm
    steps:
      - uses: actions/checkout@v4
      - name: Configure ARM64
        run: cmake -S . -B build -A ARM64
      - name: Build ARM64
        run: cmake --build build --config Release --parallel
      - name: Native Search self-test
        run: .\build\src\native\Release\TuringDesk.exe --self-test
      - uses: actions/upload-artifact@v4
        with:
          name: TuringDesk-Native-Search-ARM64
          path: build/src/native/Release/TuringDesk.exe
