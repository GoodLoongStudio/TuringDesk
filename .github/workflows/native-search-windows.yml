name: Native Search Windows

on:
  push:
    branches: [main]
    paths:
      - CMakeLists.txt
      - src/native/**
      - scripts/deploy-native-arm64.ps1
      - .github/workflows/native-search-windows.yml
  workflow_dispatch:

permissions:
  contents: write

env:
  EVERYTHING_VERSION: 1.5.0.1422b
  NODE_VERSION: 24.19.0

jobs:
  build-x64:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - name: Configure x64
        run: cmake -S . -B build -A x64
      - name: Build x64
        run: cmake --build build --config Release --parallel
      - name: Native Search self-test
        shell: pwsh
        run: |
          $process = Start-Process -FilePath ".\build\src\native\Release\TuringDesk.exe" -ArgumentList "--self-test" -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Native Search self-test failed: $($process.ExitCode)" }
      - name: Native Wallpaper self-test
        shell: pwsh
        run: |
          $process = Start-Process -FilePath ".\build\src\native\Release\TuringDeskWallpaper.exe" -ArgumentList "--self-test" -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Native Wallpaper self-test failed: $($process.ExitCode)" }
      - name: Native Harness host self-test
        shell: pwsh
        run: |
          $process = Start-Process -FilePath ".\build\src\native\Release\TuringDeskHarness.exe" -ArgumentList "--self-test" -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Native Harness host self-test failed: $($process.ExitCode)" }
      - name: Package x64 with Everything, Wallpaper, Harness and Node LTS
        shell: pwsh
        run: |
          $package = "build/package"
          $everything = Join-Path $package "Everything"
          $nodeTarget = Join-Path $package "HarnessRuntime\Node"
          New-Item -ItemType Directory -Force -Path $everything | Out-Null
          New-Item -ItemType Directory -Force -Path $nodeTarget | Out-Null
          Copy-Item "build/src/native/Release/TuringDesk.exe" (Join-Path $package "TuringDesk.exe") -Force
          Copy-Item "build/src/native/Release/TuringDeskWallpaper.exe" (Join-Path $package "TuringDeskWallpaper.exe") -Force
          Copy-Item "build/src/native/Release/TuringDeskHarness.exe" (Join-Path $package "TuringDeskHarness.exe") -Force

          $everythingZip = Join-Path $env:RUNNER_TEMP "Everything-x64.zip"
          Invoke-WebRequest "https://www.voidtools.com/Everything-$env:EVERYTHING_VERSION.x64.zip" -OutFile $everythingZip
          Expand-Archive $everythingZip -DestinationPath $everything -Force
          Invoke-WebRequest "https://www.voidtools.com/License.txt" -OutFile (Join-Path $everything "LICENSE.txt")

          $nodeFile = "node-v$env:NODE_VERSION-win-x64.zip"
          $nodeZip = Join-Path $env:RUNNER_TEMP $nodeFile
          $nodeSums = Join-Path $env:RUNNER_TEMP "node-SHASUMS256.txt"
          $nodeExtract = Join-Path $env:RUNNER_TEMP "node-x64"
          Invoke-WebRequest "https://nodejs.org/dist/v$env:NODE_VERSION/$nodeFile" -OutFile $nodeZip
          Invoke-WebRequest "https://nodejs.org/dist/v$env:NODE_VERSION/SHASUMS256.txt" -OutFile $nodeSums
          $sumLine = Get-Content $nodeSums | Where-Object { $_ -match "\s+$([regex]::Escape($nodeFile))$" } | Select-Object -First 1
          if (-not $sumLine) { throw "Node checksum entry not found for $nodeFile" }
          $expectedHash = ($sumLine -split '\s+')[0].ToLowerInvariant()
          $actualHash = (Get-FileHash $nodeZip -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actualHash -ne $expectedHash) { throw "Node SHA256 mismatch: expected $expectedHash, got $actualHash" }
          Expand-Archive $nodeZip -DestinationPath $nodeExtract -Force
          $nodeSource = Join-Path $nodeExtract "node-v$env:NODE_VERSION-win-x64"
          Copy-Item (Join-Path $nodeSource "*") $nodeTarget -Recurse -Force
      - name: Verify packaged x64 runtime
        shell: pwsh
        run: |
          $package = "build/package"
          $node = Join-Path $package "HarnessRuntime\Node"
          $required = @(
            (Join-Path $package "TuringDesk.exe"),
            (Join-Path $package "TuringDeskWallpaper.exe"),
            (Join-Path $package "TuringDeskHarness.exe"),
            (Join-Path $package "Everything\Everything.exe"),
            (Join-Path $package "Everything\LICENSE.txt"),
            (Join-Path $node "node.exe"),
            (Join-Path $node "npm.cmd"),
            (Join-Path $node "npx.cmd"),
            (Join-Path $node "LICENSE")
          )
          foreach ($path in $required) {
            if (-not (Test-Path $path -PathType Leaf)) { throw "Missing packaged file: $path" }
          }
          $nodeVersion = & (Join-Path $node "node.exe") --version
          if ($nodeVersion.Trim() -ne "v$env:NODE_VERSION") { throw "Unexpected bundled Node version: $nodeVersion" }
          $search = Start-Process -FilePath (Join-Path $package "TuringDesk.exe") -ArgumentList "--self-test" -Wait -PassThru
          if ($search.ExitCode -ne 0) { throw "Packaged TuringDesk self-test failed: $($search.ExitCode)" }
          $wallpaper = Start-Process -FilePath (Join-Path $package "TuringDeskWallpaper.exe") -ArgumentList "--self-test" -Wait -PassThru
          if ($wallpaper.ExitCode -ne 0) { throw "Packaged wallpaper self-test failed: $($wallpaper.ExitCode)" }
          $harness = Start-Process -FilePath (Join-Path $package "TuringDeskHarness.exe") -ArgumentList "--self-test" -Wait -PassThru
          if ($harness.ExitCode -ne 0) { throw "Packaged Harness host self-test failed: $($harness.ExitCode)" }
      - uses: actions/upload-artifact@v4
        with:
          name: TuringDesk-Native-Search-x64
          path: build/package/**

  build-arm64:
    runs-on: windows-11-arm
    steps:
      - uses: actions/checkout@v5
      - name: Configure ARM64
        run: cmake -S . -B build -A ARM64
      - name: Build ARM64
        run: cmake --build build --config Release --parallel
      - name: Native Search self-test
        shell: pwsh
        run: |
          $process = Start-Process -FilePath ".\build\src\native\Release\TuringDesk.exe" -ArgumentList "--self-test" -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Native Search self-test failed: $($process.ExitCode)" }
      - name: Native Wallpaper self-test
        shell: pwsh
        run: |
          $process = Start-Process -FilePath ".\build\src\native\Release\TuringDeskWallpaper.exe" -ArgumentList "--self-test" -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Native Wallpaper self-test failed: $($process.ExitCode)" }
      - name: Native Harness host self-test
        shell: pwsh
        run: |
          $process = Start-Process -FilePath ".\build\src\native\Release\TuringDeskHarness.exe" -ArgumentList "--self-test" -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Native Harness host self-test failed: $($process.ExitCode)" }
      - name: Package ARM64 with Everything, Wallpaper, Harness and Node LTS
        shell: pwsh
        run: |
          $package = "build/package"
          $everything = Join-Path $package "Everything"
          $nodeTarget = Join-Path $package "HarnessRuntime\Node"
          New-Item -ItemType Directory -Force -Path $everything | Out-Null
          New-Item -ItemType Directory -Force -Path $nodeTarget | Out-Null
          Copy-Item "build/src/native/Release/TuringDesk.exe" (Join-Path $package "TuringDesk.exe") -Force
          Copy-Item "build/src/native/Release/TuringDeskWallpaper.exe" (Join-Path $package "TuringDeskWallpaper.exe") -Force
          Copy-Item "build/src/native/Release/TuringDeskHarness.exe" (Join-Path $package "TuringDeskHarness.exe") -Force

          $everythingZip = Join-Path $env:RUNNER_TEMP "Everything-ARM64.zip"
          Invoke-WebRequest "https://www.voidtools.com/Everything-$env:EVERYTHING_VERSION.ARM64.zip" -OutFile $everythingZip
          Expand-Archive $everythingZip -DestinationPath $everything -Force
          Invoke-WebRequest "https://www.voidtools.com/License.txt" -OutFile (Join-Path $everything "LICENSE.txt")

          $nodeFile = "node-v$env:NODE_VERSION-win-arm64.zip"
          $nodeZip = Join-Path $env:RUNNER_TEMP $nodeFile
          $nodeSums = Join-Path $env:RUNNER_TEMP "node-SHASUMS256.txt"
          $nodeExtract = Join-Path $env:RUNNER_TEMP "node-arm64"
          Invoke-WebRequest "https://nodejs.org/dist/v$env:NODE_VERSION/$nodeFile" -OutFile $nodeZip
          Invoke-WebRequest "https://nodejs.org/dist/v$env:NODE_VERSION/SHASUMS256.txt" -OutFile $nodeSums
          $sumLine = Get-Content $nodeSums | Where-Object { $_ -match "\s+$([regex]::Escape($nodeFile))$" } | Select-Object -First 1
          if (-not $sumLine) { throw "Node checksum entry not found for $nodeFile" }
          $expectedHash = ($sumLine -split '\s+')[0].ToLowerInvariant()
          $actualHash = (Get-FileHash $nodeZip -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actualHash -ne $expectedHash) { throw "Node SHA256 mismatch: expected $expectedHash, got $actualHash" }
          Expand-Archive $nodeZip -DestinationPath $nodeExtract -Force
          $nodeSource = Join-Path $nodeExtract "node-v$env:NODE_VERSION-win-arm64"
          Copy-Item (Join-Path $nodeSource "*") $nodeTarget -Recurse -Force
      - name: Verify packaged ARM64 runtime
        shell: pwsh
        run: |
          $package = "build/package"
          $node = Join-Path $package "HarnessRuntime\Node"
          $required = @(
            (Join-Path $package "TuringDesk.exe"),
            (Join-Path $package "TuringDeskWallpaper.exe"),
            (Join-Path $package "TuringDeskHarness.exe"),
            (Join-Path $package "Everything\Everything.exe"),
            (Join-Path $package "Everything\LICENSE.txt"),
            (Join-Path $node "node.exe"),
            (Join-Path $node "npm.cmd"),
            (Join-Path $node "npx.cmd"),
            (Join-Path $node "LICENSE")
          )
          foreach ($path in $required) {
            if (-not (Test-Path $path -PathType Leaf)) { throw "Missing packaged file: $path" }
          }
          $nodeVersion = & (Join-Path $node "node.exe") --version
          if ($nodeVersion.Trim() -ne "v$env:NODE_VERSION") { throw "Unexpected bundled Node version: $nodeVersion" }
          $search = Start-Process -FilePath (Join-Path $package "TuringDesk.exe") -ArgumentList "--self-test" -Wait -PassThru
          if ($search.ExitCode -ne 0) { throw "Packaged TuringDesk self-test failed: $($search.ExitCode)" }
          $wallpaper = Start-Process -FilePath (Join-Path $package "TuringDeskWallpaper.exe") -ArgumentList "--self-test" -Wait -PassThru
          if ($wallpaper.ExitCode -ne 0) { throw "Packaged wallpaper self-test failed: $($wallpaper.ExitCode)" }
          $harness = Start-Process -FilePath (Join-Path $package "TuringDeskHarness.exe") -ArgumentList "--self-test" -Wait -PassThru
          if ($harness.ExitCode -ne 0) { throw "Packaged Harness host self-test failed: $($harness.ExitCode)" }
      - uses: actions/upload-artifact@v4
        with:
          name: TuringDesk-Native-Search-ARM64
          path: build/package/**

  report:
    if: always()
    needs: [build-x64, build-arm64]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ci-status
      - name: Write isolated CI status
        shell: bash
        env:
          X64_RESULT: ${{ needs.build-x64.result }}
          ARM64_RESULT: ${{ needs.build-arm64.result }}
        run: |
          mkdir -p ci
          cat > "ci/native-${GITHUB_SHA}.json" <<EOF
          {
            "sha": "${GITHUB_SHA}",
            "x64": "${X64_RESULT}",
            "arm64": "${ARM64_RESULT}",
            "run_id": "${GITHUB_RUN_ID}"
          }
          EOF
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "ci/native-${GITHUB_SHA}.json"
          git commit -m "ci: report native build ${GITHUB_SHA}" || exit 0
          for i in 1 2 3; do
            git pull --rebase origin ci-status || true
            if git push origin HEAD:ci-status; then exit 0; fi
            sleep 2
          done
          exit 1
