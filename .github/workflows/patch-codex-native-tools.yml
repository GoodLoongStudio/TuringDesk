name: Patch Codex native tools

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/patch-codex-native-tools.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0
      - name: Apply native tool integration
        shell: pwsh
        run: .\scripts\patch-codex-native-tools.ps1
      - name: Remove temporary patch files
        shell: pwsh
        run: |
          Remove-Item .\scripts\patch-codex-native-tools.ps1 -Force
          Remove-Item .\.github\workflows\patch-codex-native-tools.yml -Force
      - name: Commit final integration
        shell: pwsh
        run: |
          git config user.name "GoodLoongStudio"
          git config user.email "chnmlong@hotmail.com"
          git add -A
          git commit -m "feat: connect Codex runtime to native desktop tools"
          git push origin HEAD:main
