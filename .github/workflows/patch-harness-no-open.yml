name: Patch Harness Embedded Browser Launch

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/patch-harness-no-open.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0
      - name: Patch Harness launch and self-test
        shell: python
        run: |
          from pathlib import Path
          p = Path('src/native/src/HarnessProcessManager.cpp')
          s = p.read_text(encoding='utf-8')
          s = s.replace('constexpr wchar_t kHarnessArgs[] = L"web --host 127.0.0.1 --port 3080";',
                        'constexpr wchar_t kHarnessArgs[] = L"web --no-open --host 127.0.0.1 --port 3080";')
          s = s.replace('lib\\\\bin.js web --host 127.0.0.1 --port 3080";',
                        'lib\\\\bin.js web --no-open --host 127.0.0.1 --port 3080";')
          needle = '           dshCommand.find(L"registry.npmjs.org") == std::wstring::npos &&\n'
          if 'dshCommand.find(L"--no-open")' not in s:
              s = s.replace(needle, needle + '           dshCommand.find(L"--no-open") != std::wstring::npos &&\n')
          log_needle = '    WriteLogLine(logHandle, L"[TuringDesk] command: " + launch.commandLine);\n'
          if 'external browser: disabled' not in s:
              s = s.replace(log_needle, log_needle + '    WriteLogLine(logHandle, L"[TuringDesk] external browser: disabled; UI is hosted by TuringDesk WebView2");\n')
          p.write_text(s, encoding='utf-8')

          h = Path('src/native/src/HarnessHost.cpp')
          hs = h.read_text(encoding='utf-8')
          # Keep the explicit WebView2 navigation contract visible in source and self-documenting.
          old = '                                const std::wstring url = turingdesk::HarnessProcessManager::DefaultUrl();\n                                hr = webview_->Navigate(url.c_str());'
          new = '                                const std::wstring url = turingdesk::HarnessProcessManager::DefaultUrl();\n                                // DSH runs with --no-open; TuringDesk alone owns UI presentation here.\n                                hr = webview_->Navigate(url.c_str());'
          hs = hs.replace(old, new)
          h.write_text(hs, encoding='utf-8')
      - name: Commit patch
        shell: bash
        run: |
          rm .github/workflows/patch-harness-no-open.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/native/src/HarnessProcessManager.cpp src/native/src/HarnessHost.cpp .github/workflows/patch-harness-no-open.yml
          git commit -m "fix: keep DeepSeek Harness inside TuringDesk WebView"
          git push origin HEAD:main
