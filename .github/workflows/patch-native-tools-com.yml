name: Patch native tool COM cleanup

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/patch-native-tools-com.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0
      - name: Apply COM cleanup
        shell: pwsh
        run: .\scripts\patch-native-tools-com.ps1
      - name: Remove temporary patch files
        shell: pwsh
        run: |
          Remove-Item .\scripts\patch-native-tools-com.ps1 -Force
          Remove-Item .\.github\workflows\patch-native-tools-com.yml -Force
      - name: Commit final cleanup
        shell: pwsh
        run: |
          git config user.name "GoodLoongStudio"
          git config user.email "chnmlong@hotmail.com"
          git add -A
          git commit -m "fix: finalize native PowerPoint COM lifetime"
          git push origin HEAD:main
