name: Report tdwall Library Migration Status

on:
  workflow_run:
    workflows: ["Apply tdwall Library Migration"]
    types: [completed]

permissions:
  contents: write

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ci-status
      - name: Write migration status
        shell: bash
        env:
          SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}
          RESULT: ${{ github.event.workflow_run.conclusion }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          mkdir -p ci
          cat > "ci/tdwall-library-${SOURCE_SHA}.json" <<EOF
          {
            "sha": "${SOURCE_SHA}",
            "mode": "tdwall-library-migration",
            "result": "${RESULT}",
            "run_id": "${RUN_ID}"
          }
          EOF
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "ci/tdwall-library-${SOURCE_SHA}.json"
          git commit -m "ci: report tdwall library migration ${SOURCE_SHA}" || exit 0
          for i in 1 2 3; do
            git pull --rebase origin ci-status || true
            if git push origin HEAD:ci-status; then exit 0; fi
            sleep 2
          done
          exit 1
