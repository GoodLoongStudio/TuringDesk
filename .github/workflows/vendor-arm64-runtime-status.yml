name: Report ARM64 Runtime Vendor Status

on:
  workflow_run:
    workflows: ["Vendor ARM64 Runtime Bundle"]
    types: [completed]

permissions:
  contents: write

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ci-status
      - name: Write runtime vendor status
        shell: bash
        env:
          SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}
          VENDOR_RESULT: ${{ github.event.workflow_run.conclusion }}
          VENDOR_RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          mkdir -p ci
          cat > "ci/runtime-vendor-${SOURCE_SHA}.json" <<EOF
          {
            "sha": "${SOURCE_SHA}",
            "mode": "runtime-vendor-arm64-goz-codex-cli",
            "result": "${VENDOR_RESULT}",
            "run_id": "${VENDOR_RUN_ID}"
          }
          EOF
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "ci/runtime-vendor-${SOURCE_SHA}.json"
          git commit -m "ci: report ARM64 runtime vendor ${SOURCE_SHA}" || exit 0
          for i in 1 2 3; do
            git pull --rebase origin ci-status || true
            if git push origin HEAD:ci-status; then exit 0; fi
            sleep 2
          done
          exit 1
