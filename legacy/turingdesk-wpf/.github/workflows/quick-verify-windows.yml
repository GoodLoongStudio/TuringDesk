name: Quick Verify Windows

on:
  push:
    branches: [main]
    paths-ignore:
      - .ci/quick-verify-status.json
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: turingdesk-quick-verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quick-verify:
    runs-on: windows-11-arm
    steps:
      - uses: actions/checkout@v4

      - name: Parse verification launchers
        shell: powershell
        run: |
          foreach ($file in @(
            "scripts/quick-verify.ps1",
            "scripts/bootstrap-everything.ps1",
            "scripts/verify-app-search.ps1",
            "scripts/verify-l3-http.ps1",
            "scripts/report-quick-verify-failure.ps1"
          )) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $file), [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count -gt 0) {
              $errors | ForEach-Object { Write-Error "${file}: $($_.Message)" }
              throw "Windows PowerShell parser rejected $file"
            }
          }

      - name: Self-test diagnostic reporter
        shell: powershell
        env:
          TURINGDESK_DISABLE_GITHUB_REPORT: "1"
        run: |
          .\scripts\report-quick-verify-failure.ps1 -Stage "ci-reporter-self-test" -ExitCode 99
          $report = Get-ChildItem ".tools\quick-verify\reports\quick-verify-*.md" -ErrorAction Stop |
            Sort-Object LastWriteTimeUtc -Descending |
            Select-Object -First 1
          if (-not $report) { throw "Diagnostic reporter did not produce a local report." }
          $body = Get-Content $report.FullName -Raw
          if ($body -notmatch "ci-reporter-self-test" -or $body -notmatch "Diagnostic fingerprint") {
            throw "Diagnostic reporter output is incomplete."
          }

      - name: Prepare pinned Everything backend
        shell: powershell
        run: .\scripts\bootstrap-everything.ps1 -Architecture arm64

      - name: Verify packaged Everything components
        shell: powershell
        run: |
          $root = "src\TuringDesk.Desktop\ThirdParty\Everything"
          $arch = Join-Path $root "arm64"
          foreach ($file in @(
            (Join-Path $arch "Everything.exe"),
            (Join-Path $arch "es.exe"),
            (Join-Path $root "LICENSE-Everything.txt"),
            (Join-Path $root "LICENSE-ES.txt")
          )) {
            if (-not (Test-Path $file)) { throw "Missing packaged Everything component: $file" }
          }

          $marker = Get-Content (Join-Path $arch ".component-version") -Raw
          if ($marker -notmatch "Everything=1\.4\.1\.1032" -or $marker -notmatch "ES=1\.1\.0\.37") {
            throw "Pinned Everything component marker is invalid."
          }

      - name: Initialize pinned environment from zero and build
        shell: powershell
        env:
          TURINGDESK_FORCE_BOOTSTRAP: "1"
        run: .\scripts\quick-verify.ps1 -SkipPull -BuildOnly

      - name: Re-run with the existing pinned environment
        shell: powershell
        run: .\scripts\quick-verify.ps1 -SkipPull -BuildOnly

      - name: Verify L3 native HttpClient
        shell: powershell
        run: .\scripts\verify-l3-http.ps1

      - name: Verify L1 application search
        shell: powershell
        run: .\scripts\verify-app-search.ps1

      - name: Persist verification result
        if: ${{ always() }}
        shell: powershell
        env:
          QUICK_VERIFY_JOB_STATUS: ${{ job.status }}
        run: |
          # Cancelled runs are normally superseded by a newer main commit. Never let
          # an old runner overwrite the status of newer code.
          if ($env:QUICK_VERIFY_JOB_STATUS -eq "cancelled") {
            Write-Host "Skipping status writeback for cancelled run $env:GITHUB_RUN_ID."
            exit 0
          }

          git fetch origin main
          $remoteHead = (git rev-parse origin/main).Trim()
          if ($remoteHead -ne $env:GITHUB_SHA) {
            Write-Host "Skipping stale status writeback: run=$env:GITHUB_SHA current-main=$remoteHead"
            exit 0
          }

          New-Item -ItemType Directory -Force ".ci" | Out-Null
          $result = [ordered]@{
            commit = $env:GITHUB_SHA
            workflow_run_id = $env:GITHUB_RUN_ID
            workflow_run_attempt = $env:GITHUB_RUN_ATTEMPT
            status = $env:QUICK_VERIFY_JOB_STATUS
            checked_at_utc = (Get-Date).ToUniversalTime().ToString("o")
            runner = "windows-11-arm"
          }
          $result | ConvertTo-Json | Set-Content -Encoding UTF8 ".ci/quick-verify-status.json"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ".ci/quick-verify-status.json"
          git commit -m "ci: record quick verify result [skip ci]"
          git push origin HEAD:main
