# TuringDesk-owned DeepSeek Harness composition.
#
# SECURITY: stdout is reserved for JSON-RPC. Do not add a console logger here.
# TuringDesk deliberately does not compose Bash, PowerShell, filesystem mutation,
# install, delete, power, or unrestricted shell tools in this profile. Native
# Windows actions are exposed only through the allow-listed TuringDesk MCP server.

- id: sdk-jsonrpc-server
  name: '@deepseek-ai/dsh-sdk-jsonrpc-server'
  config:
    maxTokensAsSuccess: true

# Official DeepSeek route. The model is selected per SDK session during
# initialize; credentials remain in process environment only.
- id: llm-deepseek
  name: '@deepseek-ai/dsh-llm-deepseek'
  config:
    thinking: enabled
    reasoningEffort: max

# Generic provider route used by Ollama, LM Studio and custom OpenAI-compatible
# endpoints. TuringDesk builds this object from the user's model settings before
# the Harness process is launched. An empty object keeps the adapter dormant.
- id: llm-compatible
  name: '@deepseek-ai/dsh-llm-pi-ai'
  config:
    providers: !!js "process.env.TURINGDESK_PI_PROVIDER_JSON ? JSON.parse(process.env.TURINGDESK_PI_PROVIDER_JSON) : {}"

# UI-less / executor-less Harness agent spine. TuringDesk owns execution tools
# via MCP instead of mounting Harness shell executors.
- id: agent-spine
  name: '@deepseek-ai/dsh-agent-spine-demo'
  config:
    persona: !!js "process.env.TURINGDESK_SYSTEM_PROMPT ?? 'You are Turing, the system agent inside TuringDesk. Help the user operate their Windows desktop. Prefer the available turingdesk MCP tools for desktop actions. Never claim an action succeeded unless its tool result confirms success. Explain destructive or privileged actions instead of attempting them because those capabilities are intentionally unavailable.'"
    workspaceContext: false
    skills:
      enabled: false
    toolBash:
      enableRunInBackground: false
    toolJobs: false

- id: sessions
  name: '@deepseek-ai/dsh-session-persistence-jsonl'
  config:
    root: !!js process.env.DSH_SESSION_ROOT ?? './.turingdesk-sessions'
    compression: none

- id: session-checkpoints
  name: '@deepseek-ai/dsh-session-checkpoint-policy'

# The only Windows execution bridge exposed to the model in v0.2.
- id: turingdesk-windows
  name: '@deepseek-ai/dsh-mcp-client'
  config:
    serverName: turingdesk
    transport: stdio
    command: !!js process.env.TURINGDESK_MCP_NODE ?? process.execPath
    args:
      - !!js process.env.TURINGDESK_MCP_SERVER
    env:
      TURINGDESK_CAPABILITY_URL: !!js process.env.TURINGDESK_CAPABILITY_URL ?? 'http://127.0.0.1:4318'
    toolCallTimeoutMs: 60000
    failOnStartupError: true
    reconnect:
      enabled: true
      initialDelayMs: 500
      maxDelayMs: 10000
      maxAttempts: 8

- id: token-meter
  name: '@deepseek-ai/dsh-token-meter'

- id: compaction-basic
  name: '@deepseek-ai/dsh-compaction-basic'
  config:
    thresholdRatio: 0.8
    retainRatio: 0.16
    maxTokens: 8192
    compactionRetries: 1
