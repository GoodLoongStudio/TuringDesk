packages:
  - .

# pnpm 11 blocks dependency lifecycle scripts unless they are explicitly reviewed.
# Keep this allow-list narrow: these packages are present in the pinned Harness
# dependency tree and require their normal installation/build steps.
allowBuilds:
  esbuild: true
  '@google/genai': true
  koffi: true
  protobufjs: true
  '@deepseek-ai/dsh-subprocess-local': true
  node-pty: true
